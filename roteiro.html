<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conteúdos • Humaniza</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#f2f2f0;font-family:Inter,Arial,sans-serif}.wrap{max-width:1040px;margin:auto;padding:28px 18px 70px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:28px}.logo{width:34px;height:34px;border-radius:10px;background:#5B56FF;display:grid;place-items:center}.hero,.card,.summary{background:#1c1c1c;border:1px solid #303030;border-radius:18px;padding:22px;margin-bottom:16px}.hero{background:radial-gradient(circle at top right,rgba(91,86,255,.28),transparent 42%),#1c1c1c}.hero h1{font-size:34px;margin:8px 0}.muted{color:#aaa;line-height:1.5}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#302f63;color:#dcdafe;font-size:12px;margin:3px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.summary div{background:#151515;border-radius:12px;padding:14px}.summary small{display:block;color:#999;margin-bottom:6px}.content-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h2{margin:8px 0 2px}.block{background:#151515;border:1px solid #303030;border-radius:12px;padding:14px;margin-top:12px}.block b{display:block;margin-bottom:7px}.block p{white-space:pre-wrap;margin:0;line-height:1.55}a{color:#aaa7ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;background:#5B56FF;color:white;padding:10px 14px;border-radius:10px;font-weight:700}img.ref{max-width:100%;max-height:480px;border-radius:12px;margin-top:10px;object-fit:contain;background:#0e0e0e}.section-title{margin:30px 0 14px}@media(max-width:650px){.wrap{padding:18px 12px 45px}.hero,.card,.summary{padding:17px}.hero h1{font-size:27px}.summary{grid-template-columns:1fr}.content-head{display:block}}</style></head>
<body><main class="wrap"><div class="brand"><span class="logo">H</span> humaniza</div><div id="app"></div></main><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}function br(d){if(!d)return'';let [y,m,day]=d.split('-');return `${day}/${m}/${y}`}function link(u,label){return u?`<a class="btn" target="_blank" rel="noopener" href="${esc(u)}">${label}</a>`:''}
function item(x,i){let body=x.format==='Carrossel'?`<div class="block"><b>Cards${x.cardCount?' • '+x.cardCount:''}</b><p>${esc(x.cards)}</p></div>`:x.format==='Estático'?`<div class="block"><b>Texto da arte</b><p>${esc(x.artText)}</p></div><div class="block"><b>Direção visual</b><p>${esc(x.artDirection)}</p></div>`:`<div class="block"><b>Cenas / falas / takes</b><p>${esc(x.scenes)}</p></div>`;return `<section class="card"><div class="content-head"><div><span class="pill">Conteúdo ${i+1}</span><span class="pill">${esc(x.format)}</span>${x.status?`<span class="pill">${esc(x.status)}</span>`:''}<h2>${esc(x.title||`Conteúdo ${i+1}`)}</h2></div>${x.captureDate?`<span class="pill">Captação ${br(x.captureDate)}</span>`:''}</div>${x.briefing?`<div class="block"><b>Briefing</b><p>${esc(x.briefing)}</p></div>`:''}${x.imageLink?`<div class="block"><b>Imagem / foto de referência</b><img class="ref" src="${esc(x.imageLink)}" onerror="this.style.display='none'"><div class="actions">${link(x.imageLink,'Abrir imagem')}</div></div>`:''}<div class="block"><b>Objetivo</b><p>${esc(x.goal)}</p></div><div class="block"><b>Gancho</b><p>${esc(x.hook)}</p></div>${body}<div class="block"><b>CTA</b><p>${esc(x.cta)}</p></div><div class="actions">${link(x.referenceLink,'Abrir referência')}${link(x.approvalLink,'Abrir material no Drive')}</div></section>`}
try{let p=dec(location.hash.slice(1)),items=p.items||[],dates=p.captureDates||[...new Set(items.map(x=>x.captureDate).filter(Boolean))];document.getElementById('app').innerHTML=`<section class="hero"><span class="pill">Projeto de conteúdo</span><h1>${esc(p.client||'Projeto Humaniza')}</h1><p class="muted">Roteiros, briefing, referências e materiais preparados pela Humaniza para este projeto.</p></section><section class="summary"><div><small>Conteúdos</small><strong>${items.length}</strong></div><div><small>Período</small><strong>${esc(p.period||'Projeto avulso')}</strong></div><div><small>Captação</small><strong>${dates.length?dates.map(br).join(' • '):'A definir'}</strong></div></section><h2 class="section-title">Conteúdos do projeto</h2>${items.map(item).join('')}`;}catch(e){document.getElementById('app').innerHTML='<section class="hero"><h1>Link inválido</h1><p class="muted">Solicite um novo link à equipe Humaniza.</p></section>'}
</script></body></html>
