# Publica o Humaniza OS no Wix a cada alteração aprovada na pasta humaniza-os/ (branch main).
# Também pode ser disparado à mão em Actions → "Humaniza OS — publicar no Wix" → Run workflow.
#
# Precisa de um segredo no repositório: HUMANIZA (ou WIX_API_KEY) em Settings → Secrets and variables → Actions.
# A chave é criada no Wix em API Keys Manager, com acesso ao site "Humaniza OS".
name: Humaniza OS — publicar no Wix

on:
  push:
    branches: [main, humaniza-os-base]
    paths: ["humaniza-os/**", ".github/workflows/humaniza-os.yml"]
  workflow_dispatch:

concurrency:
  group: humaniza-os-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humaniza-os
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Login no Wix (chave de API)
        env:
          WIX_API_KEY: ${{ secrets.HUMANIZA || secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then echo "Falta o segredo HUMANIZA (chave de API do Wix) no repositório." >&2; exit 1; fi
          npx wix login --api-key "$WIX_API_KEY"

      - name: Ligar o site à hospedagem do Wix (idempotente)
        run: node scripts/wix-attach.mjs

      - name: Baixar variáveis do site
        run: npx wix env pull

      - name: Build
        run: npx wix build

      - name: Publicar
        run: npx wix release --comment "GitHub ${{ github.sha }}"
