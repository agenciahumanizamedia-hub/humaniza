# Humaniza OS — publicação no Wix em duas fases.
#
# Fase 1 (build): a cada alteração em humaniza-os/, o GitHub instala, compila (astro build) e guarda
#   o pacote "wix-build" (pasta .wix + dist) como artefato desta execução.
# Fase 2 (upload): o Claude pede ao Wix um endereço de envio (vale 1 hora), grava-o CRIPTOGRAFADO em
#   humaniza-os/.wix-upload/url.enc (chave no segredo WIX_UPLOAD_PASS) junto com o número da execução
#   da fase 1, num commit com "[wix-upload]". Este job decifra, envia o pacote e o Claude libera a
#   publicação no Wix.
#
# Por que assim: o site foi criado pela integração Wix + Claude, cuja publicação passa pela
# ferramenta de upload do Wix (não pelo `wix release` do CLI).
name: Humaniza OS — build e envio ao Wix

on:
  push:
    branches: [main, humaniza-os-base]
    paths: ["humaniza-os/**", ".github/workflows/humaniza-os.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: humaniza-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[wix-upload]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humaniza-os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Variáveis de build (o Wix preenche as secretas na publicação)
        run: |
          APP_ID=$(node -p "require('./wix.config.json').appId")
          {
            echo "WIX_CLIENT_ID=\"$APP_ID\""
            echo 'WIX_CLIENT_INSTANCE_ID="set-at-release"'
            echo 'WIX_CLIENT_PUBLIC_KEY="set-at-release"'
            echo 'WIX_CLIENT_SECRET="set-at-release"'
          } > .env.local

      - name: Build
        run: npx astro build

      - name: Empacotar
        run: |
          zip -qr ../wix-build.zip .wix dist
          echo "Tamanho do pacote: $(wc -c < ../wix-build.zip) bytes"
          sha256sum ../wix-build.zip
          echo "::notice title=pacote::bytes=$(wc -c < ../wix-build.zip)"

      - uses: actions/upload-artifact@v4
        with:
          name: wix-build
          path: wix-build.zip
          retention-days: 7

  upload:
    if: ${{ contains(github.event.head_commit.message, '[wix-upload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler pedido de envio
        id: req
        env:
          # HUMANIZA_PUBLICAR (se existir) substitui WIX_UPLOAD_PASS só para a publicação;
          # a sincronização do Meta continua usando WIX_UPLOAD_PASS.
          PASS: ${{ secrets.HUMANIZA_PUBLICAR || secrets.WIX_UPLOAD_PASS }}
        run: |
          if [ -z "$PASS" ]; then echo "Falta o segredo HUMANIZA_PUBLICAR (ou WIX_UPLOAD_PASS)." >&2; exit 1; fi
          echo "run_id=$(cat humaniza-os/.wix-upload/run-id)" >> "$GITHUB_OUTPUT"
          openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:PASS -in humaniza-os/.wix-upload/url.enc -out /tmp/url.txt
          echo "::add-mask::$(cat /tmp/url.txt)"

      - uses: actions/download-artifact@v4
        with:
          name: wix-build
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar pacote ao Wix
        run: |
          ls -l wix-build.zip
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X PUT -H 'content-type: application/zip' --data-binary @wix-build.zip "$(cat /tmp/url.txt)")
          rm -f /tmp/url.txt
          echo "HTTP $code"; head -c 300 /tmp/resp.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
